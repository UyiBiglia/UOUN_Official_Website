<head>
    <style>
        .card {
        width: min(420px, calc(100% - 32px));
        margin: 40px auto;
        padding: clamp(20px, 5vw, 36px);

        border-radius: 16px;
        background: white;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
        }

        .card h2 {
        margin-top: 0;
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        }

        .card p {
        color: #666;
        line-height: 1.6;
        }

    </style>
</head>

<body>
    <div class="card">
  <h2>Learning CSS</h2>
  <p>Build layouts that work well on phones and larger screens.</p>
  <button>Read more</button>
</div>

    



</body>
